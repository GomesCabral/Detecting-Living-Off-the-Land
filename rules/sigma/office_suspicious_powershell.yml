title: Suspicious PowerShell Execution From Word
id: 14d82d93-7db4-4af8-927c-45d3be189d21
status: experimental
description: Detects Microsoft Word launching PowerShell.
logsource:
    product: windows
    category: process_creation
detection:
    selection_parent:
        ParentImage|endswith: '\WINWORD.EXE'
    selection_child:
        Image|endswith: '\powershell.exe'
    condition: selection_parent and selection_child
falsepositives:
    - Legitimate Office automation
level: high
tags:
    - attack.execution
    - attack.t1059.001
