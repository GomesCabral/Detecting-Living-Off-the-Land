
title: Suspicious PowerShell Encoded Command
id: 71cbcc47-b00a-4fd8-9c39-2b6d79ab20a1
status: experimental
description: Detects PowerShell encoded command arguments.

logsource:
  product: windows
  category: process_creation

detection:
  selection_image:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'

  selection_command:
    CommandLine|contains:
      - ' -enc '
      - ' -encodedcommand '

  condition: selection_image and selection_command

level: high

tags:
  - attack.execution
  - attack.t1059.001
